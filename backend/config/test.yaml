logger:
  enable: false
  pretty_backtrace: false
  level: info
  format: compact
  override_filter: info
server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: 127.0.0.1
  host: http://localhost
  middlewares: {}
workers:
  mode: ForegroundBlocking
database:
  uri: '<%= get_env(name="DATABASE_URL", default="sqlite::memory:") %>'
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 600000
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
